<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDeck — Workstation Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    <header class="topbar">
      <div class="brand">
        <span class="status-indicator"></span>
        <span class="title">DevDeck</span>
      </div>

      <div class="clock-display">
        <span id="localClock">--:--:--</span>
        <span class="divider">/</span>
        <span id="utcClock">--:-- UTC</span>
      </div>

      <div class="actions-group">
        <button id="exportConfigBtn" class="action-btn">Export</button>
        <button id="importConfigBtn" class="action-btn">Import</button>
      </div>
    </header>

    <div class="search-container">
      <div class="search-bar">
        <select id="engineSelect">
          <option value="google">Google</option>
          <option value="so">StackOverflow</option>
          <option value="mdn">MDN Docs</option>
          <option value="gh">GitHub</option>
          <option value="fg">Figma</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search or use shortcuts (gh:, so:, mdn:, fg:)..." autofocus>
        <button id="searchTriggerBtn" class="btn btn-primary">Search</button>
      </div>
    </div>

    <main class="dashboard-grid">
      <section class="panel">
        <div class="panel-header">
          <h2>Frequent Hubs</h2>
        </div>
        <div class="panel-body static-links">
          <a href="https://github.com" target="_blank" rel="noopener" class="hub-link">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=32" alt="" width="16" height="16">
            <span>GitHub</span>
          </a>
          <a href="https://stackoverflow.com" target="_blank" rel="noopener" class="hub-link">
            <img src="https://www.google.com/s2/favicons?domain=stackoverflow.com&sz=32" alt="" width="16" height="16">
            <span>StackOverflow</span>
          </a>
          <a href="https://developer.mozilla.org" target="_blank" rel="noopener" class="hub-link">
            <img src="https://www.google.com/s2/favicons?domain=developer.mozilla.org&sz=32" alt="" width="16" height="16">
            <span>MDN Web Docs</span>
          </a>
          <a href="https://codepen.io" target="_blank" rel="noopener" class="hub-link">
            <img src="https://www.google.com/s2/favicons?domain=codepen.io&sz=32" alt="" width="16" height="16">
            <span>CodePen</span>
          </a>
          <a href="https://figma.com" target="_blank" rel="noopener" class="hub-link">
            <img src="https://www.google.com/s2/favicons?domain=figma.com&sz=32" alt="" width="16" height="16">
            <span>Figma</span>
          </a>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Bookmarks</h2>
        </div>
        <div class="panel-body">
          <ul id="bookmarkList" class="bookmark-collection"></ul>
          <form id="newBookmarkForm" class="bookmark-inputs">
            <input type="text" id="bmTitle" placeholder="Label" required>
            <input type="url" id="bmTargetUrl" placeholder="https://..." required>
            <button type="submit" class="btn btn-primary">+</button>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Quick Notes</h2>
        </div>
        <div class="panel-body">
          <textarea id="scratchPad" placeholder="Scratchpad for endpoints, tokens, commands..."></textarea>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
